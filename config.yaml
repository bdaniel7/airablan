debug: false

mode: proxy

stations_file: stations.yaml

ui:
  enabled: true
  host: "0.0.0.0"
  port: 9080

listen:
  host: "0.0.0.0"
  port: 443

listen_http:
  host: "0.0.0.0"
  port: 80

hosts:
  3573112786.airable.io:
    upstream: "https://3573112786.airable.io"
    upstream_ip: "116.202.163.182"   # real IP, so the proxy doesn't loop back to itself
    cert: "ssl/3573112786.airable.io.crt"
    key: "ssl/3573112786.airable.io.key"
  static.airable.io:
    upstream: "https://static.airable.io"
    upstream_ip: "176.9.116.234"     # real IP, so the proxy doesn't loop back to itself
    cert: "ssl/static.airable.io.crt"
    key: "ssl/static.airable.io.key"
    mirrored: true   # always relay+cache logos, even in offline mode

upstream:
  timeout_seconds: 30
  verify_ssl: true

cache:
  enabled: true
  ttl_days: 365
  stale_on_error: true

capture:
  enabled: true

stations_log:
  enabled: true
  file: "stations_seen.yaml"   # relative to data_dir

dns:
  enabled: false
  host: "0.0.0.0"
  port: 53
  upstream: "1.1.1.1"
  upstream_port: 53
  override:
    "3573112786.airable.io": "10.0.0.101"
    "static.airable.io": "10.0.0.101"

data_dir: "data"